name: "Build Cargo"

on:
  push:
    branches: [ "master" ]
    paths:
      - '.github/workflows/**'
      - 'permissions/**'
      - 'android/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'build.rs'
  pull_request:
    branches: [ "master" ]
    paths:
      - '.github/workflows/**'
      - 'permissions/**'
      - 'android/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'build.rs'

permissions:
  contents: read

jobs:
  build-plugin-cargo:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: |
            sudo apt-get update
            sudo apt-get install -y curl wget file libxdo-dev build-essential libssl-dev libgtk-3-dev libappindicator3-dev libwebkit2gtk-4.1-dev librsvg2-dev
      - run: |
          cargo build --release
